[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cachepilot"
version = "0.1.0"
description = "CPU-first control-plane skeleton for CachePilot"
readme = "README.md"
requires-python = "==3.13.15"
license = { text = "Apache-2.0" }
authors = [{ name = "CachePilot contributors" }]
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "starlette==0.46.2",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[project.scripts]
cachepilot-server = "cachepilot.server:main"
cachepilot-empty-service = "cachepilot.runtime.empty_service:main"
cachepilot-gateway = "cachepilot.gateway.api:main"

[tool.setuptools.packages.find]
include = ["cachepilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["notebooks"]
